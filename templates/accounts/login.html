<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.bsTheme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<title>Log in | Facing</title>
</head>
<body>
<main class="container auth-wrap"><div class="row w-100 justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="text-center mb-4"><div class="brand fs-1"><i class="bi bi-lightning-charge-fill"></i> Facing</div><p class="muted">Log in to see what your friends are sharing.</p></div>
  <form class="card auth-card needs-validation" method="post" novalidate>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required><div class="invalid-feedback">Enter a valid email.</div></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required><div class="invalid-feedback">Enter your password.</div></div>
    <button class="btn btn-brand w-100 py-2">Log in</button>
    <p class="text-center small mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
  </form></div></div></main>
<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body></html>
